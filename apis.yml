aid: cyberark-identity
name: CyberArk Identity
description: >-
  CyberArk Identity is a SaaS identity and access management platform
  offering single sign-on (SSO), multi-factor authentication (MFA),
  adaptive access, lifecycle management, directory services, and
  privileged access controls for workforce and customer identities.
  The platform integrates with thousands of applications and supports
  enterprise zero-trust strategies. CyberArk Identity exposes REST APIs
  for authentication, authorization, user and role management, and
  policy operations, authenticated via OAuth 2.0 (including
  client_credentials) or session tokens obtained via
  /Security/StartAuthentication and /Security/AdvanceAuthentication.
