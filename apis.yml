    name: CyberArk Identity API
    description: >-
      REST API for CyberArk Identity covering authentication,
      authorization, OAuth 2.0 token endpoints, user and role management,
      directory services, application provisioning, and policy operations.
      Supports OAuth 2.0 flows including client_credentials for
      non-interactive API access, plus session-based authentication via
      /Security/StartAuthentication and /Security/AdvanceAuthentication.
